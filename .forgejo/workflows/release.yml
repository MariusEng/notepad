# Builds Notepad for Linux and Windows on a Linux runner (Docker), and publishes a release when both are green.
#
#  - Every push to main builds both. If both succeed and there is no release yet for the version in package.json,
#    the `release` job creates release v<version> (tagging the built commit) with the installers attached and the
#    commit titles since the previous release as notes. Same version as an existing release (e.g. a docs-only
#    push): it builds, but publishes nothing.
#  - Pushing a tag by hand (git tag v0.12.0 && git push origin v0.12.0) builds that commit and attaches the files to
#    that tag's release.
#  - Actions → release → Run workflow: builds only (download the files from the run's artifacts).
#  - macOS is built on a Mac and attached to the same release with scripts/release-mac.sh.
#
# Each job's output is also attached to the draft release "CI logs" (read with scripts/ci-log.sh), because this
# Forgejo has no API for job logs.
#
# The runner needs the `docker` label (forgejo-runner's default). Change `runs-on` if yours is labelled otherwise.
# The Windows installer is cross-compiled on Linux (cargo-xwin + NSIS), which Tauri calls experimental; it is
# unsigned, so Windows SmartScreen will warn ("More info" → "Run anyway").
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  # Downloads the Microsoft CRT/SDK headers for the Windows build; by using it you accept Microsoft's license.
  XWIN_ACCEPT_LICENSE: "1"
  # linuxdeploy (AppImage) can't use FUSE inside a container; it unpacks itself instead.
  APPIMAGE_EXTRACT_AND_RUN: "1"

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: System packages
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config perl \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev rpm xdg-utils python3

      - name: Rust
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          npm ci
          npx tauri build --bundles deb,rpm,appimage

      - name: Collect
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm \
             src-tauri/target/release/bundle/appimage/*.AppImage out/
          ls -la out

      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: notepad-linux
          path: out/

      - name: Upload build log
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/ci-log.sh upload /tmp/ci.log "run${{ github.run_number }}-linux-${{ job.status }}.log"

  windows:
    runs-on: docker
    container:
      # Trixie: its NSIS (3.11) has Win\RestartManager.nsh, which Tauri's installer script needs (bookworm's 3.08 doesn't).
      image: node:20-trixie
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: System packages
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl perl nsis lld llvm clang python3
          makensis -VERSION

      - name: Rust and cargo-xwin
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target x86_64-pc-windows-msvc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install --locked cargo-xwin

      - name: Build (NSIS installer)
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          npm ci
          npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          mkdir -p out
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe out/
          ls -la out

      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: notepad-windows
          path: out/

      - name: Upload build log
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/ci-log.sh upload /tmp/ci.log "run${{ github.run_number }}-windows-${{ job.status }}.log"

  # Runs only when both builds are green.
  release:
    needs: [linux, windows]
    if: github.event_name == 'push'
    runs-on: docker
    container:
      image: node:20-bookworm
    env:
      FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGEJO_URL: ${{ github.server_url }}
      FORGEJO_REPO: ${{ github.repository }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Decide
        id: decide
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p 'require("./package.json").version')"
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_URL/api/v1/repos/$FORGEJO_REPO/releases/tags/$tag")
            if [ "$code" = "200" ]; then
              echo "$tag already exists: not publishing (bump the version to make a release)"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$tag" | head -1 || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' ${prev:+$prev..}"${GITHUB_SHA}" | head -60
            echo
            echo "## Downloads"
            echo
            echo "- **Windows**: \`Notepad_*_x64-setup.exe\` (unsigned: SmartScreen → More info → Run anyway)"
            echo "- **Linux**: \`.deb\` (Debian/Ubuntu), \`.rpm\` (Fedora/openSUSE) or \`.AppImage\` (any distribution)"
            echo "- **macOS** (Apple Silicon): \`.dmg\`, added from a Mac (unsigned: right-click → Open the first time)"
          } > /tmp/notes.md
          cat /tmp/notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: https://code.forgejo.org/actions/download-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: dist-release

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        env:
          FORGEJO_TARGET: ${{ github.sha }}
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          ls -laR dist-release
          RELEASE_NOTES="$(cat /tmp/notes.md)" scripts/forgejo-release.sh "${{ steps.decide.outputs.tag }}" dist-release/*/*

      - name: Upload build log
        if: always()
        run: scripts/ci-log.sh upload /tmp/ci.log "run${{ github.run_number }}-release-${{ job.status }}.log"
