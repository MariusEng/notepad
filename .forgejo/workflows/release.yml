# Builds Notepad for Linux (Docker runner) and for macOS and Windows (Mac runner), and publishes a release when all
# three are green.
#
#  - Every push to main builds both. If both succeed and there is no release yet for the version in package.json,
#    the `release` job creates release v<version> (tagging the built commit) with the installers attached and the
#    commit titles since the previous release as notes. Same version as an existing release (e.g. a docs-only
#    push): it builds, but publishes nothing.
#  - Pushing a tag by hand (git tag v0.12.0 && git push origin v0.12.0) builds that commit and attaches the files to
#    that tag's release.
#  - Actions → release → Run workflow: builds only (download the files from the run's artifacts).
#  - macOS is built on a Mac runner (label `macos`, host mode: see the macos job).
#  - The release is also published for friends on https://deling.1011.no/notepad with all files at once (Actions
#    secret DELING_TOKEN; see scripts/deling-publish.sh). If the Mac runner is down, scripts/release-mac.sh on any
#    Mac adds the dmg to the release and republishes the full set on deling.
#
# Each job's output is also attached to the draft release "CI logs" (read with scripts/ci-log.sh), because this
# Forgejo has no API for job logs.
#
# The runner needs the `docker` label (forgejo-runner's default). Change `runs-on` if yours is labelled otherwise.
# The Windows installer is cross-compiled on the Mac (cargo-xwin + NSIS), which Tauri calls experimental; it is
# unsigned, so Windows SmartScreen will warn ("More info" → "Run anyway").
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  # Downloads the Microsoft CRT/SDK headers for the Windows build; by using it you accept Microsoft's license.
  XWIN_ACCEPT_LICENSE: "1"
  # linuxdeploy (AppImage) can't use FUSE inside a container; it unpacks itself instead.
  APPIMAGE_EXTRACT_AND_RUN: "1"

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: System packages
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config perl \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev rpm xdg-utils python3

      - name: Rust
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          npm ci
          npx tauri build --bundles deb,rpm,appimage

      - name: Collect
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm \
             src-tauri/target/release/bundle/appimage/*.AppImage out/
          ls -la out

      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: notepad-linux
          path: out/

      - name: Upload build log
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/ci-log.sh upload /tmp/ci.log "run${{ github.run_number }}-linux-${{ job.status }}.log"

  # Cross-compiled on the Mac runner (host mode): Rust's Windows target + cargo-xwin (Microsoft's SDK headers,
  # downloaded once), Homebrew's llvm + lld for clang-cl/lld-link, NSIS for the installer. What the job installs stays on the Mac.
  windows:
    runs-on: macos
    env:
      # A fixed build folder in the runner's home: each run only recompiles what changed (a job's own folder is new
      # every run). Cargo locks it, so overlapping runs wait for each other.
      CARGO_TARGET_DIR: /Users/forgejo-runner/.cache/notepad-ci/target-windows
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Tools
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          : > ci.log
          exec > >(tee -a ci.log) 2>&1
          b="$(brew --prefix)"
          if ! command -v makensis >/dev/null || [ ! -x "$b/opt/llvm/bin/clang-cl" ] || [ ! -x "$b/opt/lld/bin/lld-link" ]; then
            brew install nsis llvm lld || {
              echo "Couldn't install NSIS/LLVM/LLD as $(whoami). Run once as an admin on the Mac: brew install nsis llvm lld"
              exit 1
            }
          fi
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          rustup target add x86_64-pc-windows-msvc
          command -v cargo-xwin >/dev/null || cargo install --locked cargo-xwin
          makensis -VERSION; cargo --version; cargo xwin --version

      - name: Build (NSIS installer)
        run: |
          b="$(/opt/homebrew/bin/brew --prefix)"
          export PATH="$b/opt/llvm/bin:$b/opt/lld/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          exec > >(tee -a ci.log) 2>&1
          rm -rf "$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/bundle"
          npm ci
          npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect
        run: |
          exec > >(tee -a ci.log) 2>&1
          rm -rf out && mkdir -p out
          cp "$CARGO_TARGET_DIR"/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe out/
          ls -la out

      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: notepad-windows
          path: out/

      - name: Upload build log
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/ci-log.sh upload ci.log "run${{ github.run_number }}-windows-${{ job.status }}.log"

  # On the Mac runner itself (host mode, no container): register it with the label `macos:host`. It needs Xcode's
  # command line tools and Node 20+; Rust is installed for the runner's user on the first run if it is missing.
  macos:
    runs-on: macos
    env:
      CARGO_TARGET_DIR: /Users/forgejo-runner/.cache/notepad-ci/target-macos # see the windows job
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:

      - name: Build
        run: |
          # A runner started by launchd doesn't get the shell's PATH.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          : > ci.log
          exec > >(tee -a ci.log) 2>&1
          xcode-select -p >/dev/null 2>&1 || { echo "Xcode command line tools missing on the runner: xcode-select --install"; exit 1; }
          # Rust for the runner's own user, installed once (host mode: it stays in its home folder).
          if ! command -v cargo >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          node --version; cargo --version
          rm -rf "$CARGO_TARGET_DIR/release/bundle"
          npm ci
          # CI=true makes Tauri skip the Finder styling of the dmg window (needs no GUI session).
          CI=true npx tauri build --bundles app,dmg

      - name: Collect
        run: |
          exec > >(tee -a ci.log) 2>&1
          rm -rf out && mkdir -p out
          cp "$CARGO_TARGET_DIR"/release/bundle/dmg/*.dmg out/
          ls -la out

      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: notepad-macos
          path: out/

      - name: Upload build log
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/ci-log.sh upload ci.log "run${{ github.run_number }}-macos-${{ job.status }}.log"

  # Runs only when all three builds are green.
  release:
    needs: [linux, windows, macos]
    if: github.event_name == 'push'
    runs-on: docker
    container:
      image: node:20-bookworm
    env:
      FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGEJO_URL: ${{ github.server_url }}
      FORGEJO_REPO: ${{ github.repository }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Decide
        id: decide
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p 'require("./package.json").version')"
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_URL/api/v1/repos/$FORGEJO_REPO/releases/tags/$tag")
            if [ "$code" = "200" ]; then
              echo "$tag already exists: not publishing (bump the version to make a release)"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Release notes: this version's section of CHANGELOG.md (commit titles if it has none).
          changes=$(scripts/release-notes.sh section "$tag")
          if [ -z "$changes" ]; then
            echo "::warning::CHANGELOG.md has no section for $tag; using the commit titles"
            prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$tag" | head -1 || true)
            changes=$(git log --no-merges --pretty='- %s' ${prev:+$prev..}"${GITHUB_SHA}" | head -60)
          fi
          {
            echo "## Changes"
            echo
            echo "$changes"
            echo
            echo "All versions: [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/src/branch/main/CHANGELOG.md)"
          } > /tmp/notes.md
          cat /tmp/notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: https://code.forgejo.org/actions/download-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: dist-release

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        env:
          FORGEJO_TARGET: ${{ github.sha }}
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          ls -laR dist-release
          RELEASE_NOTES="$(cat /tmp/notes.md)" scripts/forgejo-release.sh "${{ steps.decide.outputs.tag }}" dist-release/*/*

      # Friends download from https://deling.1011.no/notepad: every platform in one release.
      - name: Publish on deling.1011.no
        if: steps.decide.outputs.publish == 'true'
        env:
          DELING_TOKEN: ${{ secrets.DELING_TOKEN }}
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          # Intro, downloads and the whole changelog, so the page grows with every release.
          scripts/release-notes.sh deling "${{ steps.decide.outputs.tag }}" > /tmp/deling-readme.md
          scripts/deling-publish.sh "${{ steps.decide.outputs.tag }}" /tmp/deling-readme.md dist-release/*/*

      - name: Upload build log
        if: always()
        run: scripts/ci-log.sh upload /tmp/ci.log "run${{ github.run_number }}-release-${{ job.status }}.log"
