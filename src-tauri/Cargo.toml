[package]
name = "notepad"
version = "0.1.0"
description = "A modern notepad with WYSIWYG Markdown and syntax highlighting"
edition = "2021"

[lib]
name = "notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
