[package]
name = "notepad"
version = "0.19.1"
description = "A modern notepad with WYSIWYG Markdown and syntax highlighting"
license = "MIT"
edition = "2021"

[lib]
name = "notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Git (libgit2, HTTPS only), sign-in and provider APIs
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"
encoding_rs = "0.8"
# Sidebar "Move to Trash" (macOS Trash, Windows Recycle Bin, freedesktop trash)
trash = "5"
tauri-plugin-single-instance = "2"
# SQLite databases (File → New Database…, opening .sqlite/.db files). Bundled: no system SQLite needed.
rusqlite = { version = "0.43", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# libgit2 uses the system TLS on macOS and Windows, but its openssl-sys dependency still gets built on
# every unix: vendoring OpenSSL means no Homebrew/OpenSSL install is needed (adds a minute to the first build).
[target.'cfg(unix)'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

# Windows: turn off WebView2's own browser shortcuts (Ctrl+N new window, F5 reload…) so they reach Notepad.
# Same versions as wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[dev-dependencies]
tempfile = "3"
